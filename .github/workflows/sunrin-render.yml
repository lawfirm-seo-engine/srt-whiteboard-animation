name: Sunrin Whiteboard Render
on:
  workflow_dispatch:
    inputs:
      mode:
        description: images, preview, final or direct
        required: true
        type: choice
        options: [direct, images, preview, final]
      job:
        description: Project folder id
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install dependencies
        run: pip install opencv-python-headless numpy av Pillow
      - name: Run pipeline
        run: python scripts/sunrin_pipeline_assets.py "${{ inputs.mode }}" "${{ inputs.job }}"
      - name: Commit generated assets
        if: always()
        run: |
          git config user.name "sunrin-whiteboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "projects/${{ inputs.job }}"
          git add -f "projects/${{ inputs.job }}/final.mp4" 2>/dev/null || true
          git add -f "projects/${{ inputs.job }}/preview.mp4" 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "render: ${{ inputs.mode }} ${{ inputs.job }}"
          git pull --rebase origin main
          git push
