<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선린 Whiteboard Studio</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header><div><span class="eyebrow">법무법인 선린</span><h1>Whiteboard Studio</h1><p>상황을 구성하고 원본 hand-drawing 렌더러용 프로젝트를 생성합니다.</p></div><div class="badge">STREAM DRAWING</div></header>
<section class="panel form"><label>영상 제목<input id="title" value="주식리딩방 사기"></label><label>상황 템플릿<select id="template"></select></label><div class="row"><label>길이(초)<input id="duration" type="number" min="5" max="300" value="30"></label><label>화면비<select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></label></div><label>프로젝트 ID <small>비우면 제목으로 자동 생성</small><input id="project" placeholder="stock-reading-room-01"></label></section>
<section class="sceneHead"><div><h2>장면 구성</h2><p>순서, 내레이션, 화면 상황을 자유롭게 바꿀 수 있습니다.</p></div><button id="add" class="secondary">+ 장면 추가</button></section><div id="scenes"></div>
<footer><button id="build" class="primary">프로젝트 생성</button><div id="status">대기 중</div></footer></main><template id="sceneTpl"><article class="scene panel"><div class="sceneTop"><strong class="num"></strong><div class="actions"><button class="up">↑</button><button class="down">↓</button><button class="delete">삭제</button></div></div><div class="row"><label>역할<input class="role"></label><label>시간 가중치<input class="weight" type="number" min="0.1" step="0.1"></label></div><label>내레이션<textarea class="narration" rows="2"></textarea></label><label>그림 상황 설명<textarea class="visual" rows="3"></textarea></label></article></template><script src="app.js"></script></body></html>
